 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidora AI - AI Video Creator</title>
 <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header>
    <h1>Vidora AI</h1>
    <p>AI Video Creator</p>
  </header>

  <main>
    <section>
      <h2>Create Your Video</h2>

      <textarea id="prompt" placeholder="Describe the video you want to create..."></textarea>
<div class="video-settings">

  <h3>Video Settings</h3>

  <label for="duration">Duration</label>
  <select id="duration">
  <option value="30">30 seconds</option>
  <option value="60">1 minute</option>
  <option value="180">3 minutes</option>
  <option value="300">5 minutes</option>
  <option value="600">10 minutes</option>
  <option value="1200">20 minutes</option>
  <option value="1800">30 minutes</option>
  <option value="2700">45 minutes</option>
  <option value="3600">1 hour</option>
</select>

  <label for="aspectRatio">Aspect Ratio</label>
  <select id="aspectRatio">
    <option value="16:9">16:9 — Landscape</option>
    <option value="9:16">9:16 — Portrait</option>
    <option value="1:1">1:1 — Square</option>
  </select>

  <label for="style">Video Style</label>
  <select id="style">
    <option value="cinematic">Cinematic</option>
    <option value="realistic">Realistic</option>
    <option value="animation">Animation</option>
    <option value="documentary">Documentary</option>
    <option value="advertisement">Advertisement</option>
  </select>

</div>
      <button id="createVideo">Create Video</button>

      <p id="status"></p>
      <div <div id="videoContainer" class="video-result">
  <div class="video-result-header">
    <h3>🎬 Your Generated Video</h3>
    <p>Your video will appear here when generation is complete.</p>
  </div>
</div>
    </section>
  </main>

  <footer>
    <p>© 2026 Vidora AI</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
